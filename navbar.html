<!-- navbar.html -->
<header class="header">
  <div class="container">
    <div class="header__wrapper">

      <!-- LOGO -->
      <a href="index.html#hero" class="header__logo" aria-label="VM Agency - Inicio">
        <img src="assets/logos/logo.webp" alt="VM Agency">
      </a>

      <!-- NAVIGATION -->
      <nav class="header__nav" id="navbar" aria-label="Navegación principal">
        <ul class="header__menu">

          <li class="header__item">
            <a href="index.html#hero"
               class="header__link text-sm"
               data-lang="nav.home">
              Inicio
            </a>
          </li>

          <li class="header__item">
            <a href="index.html#method"
               class="header__link text-sm"
               data-lang="nav.method">
              Método VM
            </a>
          </li>

          <li class="header__item">
            <a href="index.html#solutions"
               class="header__link text-sm"
               data-lang="nav.success">
              Soluciones
            </a>
          </li>

          <li class="header__item">
            <a href="index.html#about"
               class="header__link text-sm"
               data-lang="nav.about">
              Sobre nosotros
            </a>
          </li>

          <li class="header__item">
            <a href="index.html#contact"
               class="header__link text-sm"
               data-lang="nav.contactUs">
              Contacto
            </a>
          </li>

          <li class="header__item">
            <a href="faq.html"
               class="header__link text-sm"
               data-lang="nav.faq">
              FAQ
            </a>
          </li>

        </ul>
      </nav>

      <!-- RIGHT: LANGUAGES + HAMBURGER -->
      <div class="header__right">

        <div class="language-selector" aria-label="Seleccionar idioma">
          <button type="button"
                  class="language-selector__button text-sm"
                  data-language="es"
                  aria-label="Español">
            ES
          </button>

          <button type="button"
                  class="language-selector__button text-sm"
                  data-language="en"
                  aria-label="English">
            EN
          </button>

          <button type="button"
                  class="language-selector__button text-sm"
                  data-language="bg"
                  aria-label="Български">
            BG
          </button>
        </div>

        <button type="button"
                id="menu-toggle"
                class="header__toggle"
                aria-label="Abrir menú"
                aria-controls="navbar"
                aria-expanded="false">
          <span></span>
          <span></span>
          <span></span>
        </button>

      </div>
    </div>
  </div>
</header>
