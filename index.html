<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>VM Agency</title>

    <meta
            name="description"
            content="VM Agency · Estrategia, Automatización, Desarrollo Web, IA y Marketing Digital.">

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@latest/font/lucide.css">
    <!-- CSS BASE -->
    <link rel="stylesheet" href="css/base/reset.css">
    <link rel="stylesheet" href="css/base/variables.css">
    <link rel="stylesheet" href="css/base/global.css">
    <link rel="stylesheet" href="css/base/typography.css">
    <link rel="stylesheet" href="css/base/components.css">
    <!-- LAYOUT -->

    <link rel="stylesheet" href="css/layout/container.css">

    <link rel="stylesheet" href="css/layout/header.css">

    <link rel="stylesheet" href="css/layout/footer.css">

    <!-- SECTIONS -->

    <link rel="stylesheet" href="css/sections/hero.css">

    <link rel="stylesheet" href="css/sections/solutions.css">

    <link rel="stylesheet" href="css/sections/method.css">

    <link rel="stylesheet" href="css/sections/success.css">

    <link rel="stylesheet" href="css/sections/about.css">

    <link rel="stylesheet" href="css/sections/contact.css">

    <!-- RESPONSIVE -->

    <link rel="stylesheet" href="css/responsive.css">

</head>

<body>

<!-- ========================================================= -->
<!-- HEADER -->
<!-- ========================================================= -->

<header class="header">

    <div class="container">

        <div class="header__wrapper">

            <!-- ===================================================== -->
            <!-- LOGO -->
            <!-- ===================================================== -->

            <a
                    href="#hero"
                    class="header__logo">

                <img
                        src="assets/logos/logo.png"
                        alt="VM Agency Logo">

            </a>

            <!-- ===================================================== -->
            <!-- NAVIGATION -->
            <!-- ===================================================== -->

            <nav
                    class="header__nav"
                    id="navbar">

                <ul class="header__menu">

                    <li class="header__item">

                        <a
                                href="#hero"
                                class="header__link text-sm active"
                                data-lang="nav.home">
                            Inicio
                        </a>

                    </li>

                    <li class="header__item">

                        <a
                                href="#method"
                                class="header__link text-sm"
                                data-lang="nav.method">
                            Método VM
                        </a>

                    </li>

                    <li class="header__item">

                        <a
                                href="#solutions"
                                class="header__link text-sm"
                                data-lang="nav.success">
                            Soluciones
                        </a>

                    </li>

                    <li class="header__item">

                        <a
                                href="#about"
                                class="header__link text-sm"
                                data-lang="nav.about">
                            Sobre nosotros
                        </a>

                    </li>

                    <li class="header__item">

                        <a
                                href="#contact"
                                class="header__link text-sm"
                                data-lang="nav.contactUs">
                            Contacto
                        </a>

                    </li>

                </ul>

            </nav>

            <!-- ===================================================== -->
            <!-- RIGHT -->
            <!-- ===================================================== -->

            <div class="header__right">

                <div class="language-selector">

                    <button
                            class="language-selector__button text-sm active"
                            data-language="es">

                        ES

                    </button>

                    <button
                            class="language-selector__button text-sm"
                            data-language="en">

                        EN

                    </button>

                    <button
                            class="language-selector__button text-sm"
                            data-language="bg">

                        BG

                    </button>

                </div>

                <button
                        id="menu-toggle"
                        class="header__toggle"
                        aria-label="Abrir menú">

                    <span></span>

                    <span></span>

                    <span></span>

                </button>

            </div>

        </div>

    </div>

</header>

<!-- ========================================================= -->
<!-- MAIN -->
<!-- ========================================================= -->

<main>

    <!-- ========================================================= -->
    <!-- HERO -->
    <!-- ========================================================= -->

    <section id="hero" class="hero">

        <div class="container">

            <div class="hero__wrapper">

                <!-- CONTENIDO -->

                <div class="hero__content">

                <span
                        class="hero__eyebrow text-sm"
                        data-lang="hero.eyebrow">
                </span>

                    <h1 class="hero__title title-xl">

                        <span data-lang="hero.titleLine1"></span><br>

                        <span data-lang="hero.titleLine2"></span>

                        <span
                                class="hero__highlight"
                                data-lang="hero.highlight">
                    </span>

                        <br>

                        <span data-lang="hero.titleLine3"></span>

                    </h1>

                    <p
                            class="hero__description text"
                            data-lang="hero.description">
                    </p>

                    <div class="hero__actions">

                        <a
                                href="#contact"
                                class="button button--primary">

                            <span data-lang="hero.button"></span>

                        </a>

                    </div>

                </div>

                <!-- IMAGEN -->

                <div class="hero__image">

                    <img
                            src="assets/images/hero.webp"
                            alt="Equipo de VM Agency trabajando">

                </div>

            </div>

        </div>

        <a href="#method" class="hero__scroll" aria-label="Ir al Método VM">

            <svg
                    width="28"
                    height="28"
                    viewBox="0 0 24 24"
                    fill="none">

                <path
                        d="M12 5V18"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"/>

                <path
                        d="M7 13L12 18L17 13"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"/>

            </svg>

        </a>
    </section>
    <section class="method" id="method">

        <div class="container">

            <div class="method__header reveal">

            <span
                    class="method__eyebrow text-sm"
                    data-lang="method.eyebrow">
            </span>

                <h2 class="method__title title-lg">

                    <span data-lang="method.title1"></span>

                    <span
                            class="method__highlight"
                            data-lang="method.title2">
                </span>

                </h2>

                <p
                        class="method__description text"
                        data-lang="method.description">
                </p>

            </div>

            <div class="method__timeline">

                <!-- STEP 1 -->

                <article class="method__step reveal">

                    <div class="method__top">

                        <div class="method__icon">
                            <i class="icon-search"></i>
                        </div>

                        <span class="method__number">01</span>

                    </div>

                    <div class="method__content">

                        <span class="method__number-mobile">01 —</span>

                        <h3 data-lang="method.step1.title"></h3>

                        <p data-lang="method.step1.description"></p>

                    </div>

                </article>

                <!-- STEP 2 -->

                <article class="method__step reveal">

                    <div class="method__top">

                        <div class="method__icon">
                            <i class="icon-chart-column"></i>
                        </div>

                        <span class="method__number">02</span>

                    </div>

                    <div class="method__content">

                        <span class="method__number-mobile">02 —</span>

                        <h3 data-lang="method.step2.title"></h3>

                        <p data-lang="method.step2.description"></p>

                    </div>

                </article>

                <!-- STEP 3 -->

                <article class="method__step reveal">

                    <div class="method__top">

                        <div class="method__icon">
                            <i class="icon-route"></i>
                        </div>

                        <span class="method__number">03</span>

                    </div>

                    <div class="method__content">

                        <span class="method__number-mobile">03 —</span>

                        <h3 data-lang="method.step3.title"></h3>

                        <p data-lang="method.step3.description"></p>

                    </div>

                </article>

                <!-- STEP 4 -->

                <article class="method__step reveal">

                    <div class="method__top">

                        <div class="method__icon">
                            <i class="icon-settings"></i>
                        </div>

                        <span class="method__number">04</span>

                    </div>

                    <div class="method__content">

                        <span class="method__number-mobile">04 —</span>

                        <h3 data-lang="method.step4.title"></h3>

                        <p data-lang="method.step4.description"></p>

                    </div>

                </article>

                <!-- STEP 5 -->

                <article class="method__step reveal">

                    <div class="method__top">

                        <div class="method__icon">
                            <i class="icon-sliders-horizontal"></i>
                        </div>

                        <span class="method__number">05</span>

                    </div>

                    <div class="method__content">

                        <span class="method__number-mobile">05 —</span>

                        <h3 data-lang="method.step5.title"></h3>

                        <p data-lang="method.step5.description"></p>

                    </div>

                </article>

                <!-- STEP 6 -->

                <article class="method__step reveal">

                    <div class="method__top">

                        <div class="method__icon">
                            <i class="icon-trending-up"></i>
                        </div>

                        <span class="method__number">06</span>

                    </div>

                    <div class="method__content">

                        <span class="method__number-mobile">06 —</span>

                        <h3 data-lang="method.step6.title"></h3>

                        <p data-lang="method.step6.description"></p>

                    </div>

                </article>

            </div>

        </div>

    </section>



    <section class="solutions" id="solutions">

        <div class="container">

            <div class="solutions__header reveal">

                <h2 class="solutions__title title-lg">

                    <span data-lang="solutions.title1"></span>

                    <span class="solutions__highlight" data-lang="solutions.highlight"></span>

                    <span data-lang="solutions.title2"></span>

                </h2>

                <p
                        class="solutions__description text"
                        data-lang="solutions.description">
                </p>

            </div>

            <div class="solutions__grid">

                <article class="solution-card reveal">
                    <a href="webservice.html" class="solution-card__link">

                    <div class="solution-card__image">

                        <img
                                src="assets/images/web.webp"
                                alt="Desarrollo Web">

                    </div>

                    <div class="solution-card__body">

                    <span
                            class="solution-card__number text-sm"
                            data-lang="solutions.card1.number">
                    </span>

                        <h3
                                class="solution-card__title title-md"
                                data-lang="solutions.card1.title">
                        </h3>

                        <p
                                class="solution-card__text text"
                                data-lang="solutions.card1.description">
                        </p>



                    </div>
                    </a>

                </article>

                <article class="solution-card reveal">
                    <a
                            href="ia.html"
                            class="solution-card__link">
                    <div class="solution-card__image">

                        <img
                                src="assets/images/automation.webp"
                                alt="Automatización">

                    </div>

                    <div class="solution-card__body">

                    <span
                            class="solution-card__number text-sm"
                            data-lang="solutions.card2.number">
                    </span>

                        <h3
                                class="solution-card__title title-md"
                                data-lang="solutions.card2.title">
                        </h3>

                        <p
                                class="solution-card__text text"
                                data-lang="solutions.card2.description">
                        </p>



                    </div>
                    </a>
                </article>

                <article class="solution-card reveal">
                    <a href="marketing.html" class="solution-card__link">

                    <div class="solution-card__image">

                        <img
                                src="assets/images/marketing.webp"
                                alt="Marketing Digital">

                    </div>

                    <div class="solution-card__body">

                    <span
                            class="solution-card__number text-sm"
                            data-lang="solutions.card3.number">
                    </span>

                        <h3
                                class="solution-card__title title-md"
                                data-lang="solutions.card3.title">
                        </h3>

                        <p
                                class="solution-card__text text"
                                data-lang="solutions.card3.description">
                        </p>




                    </div>
                    </a>

                </article>

                <article class="solution-card reveal">
                    <a href="consultoria.html" class="solution-card__link">
                    <div class="solution-card__image">

                        <img
                                src="assets/images/consulting.webp"
                                alt="Consultoría Estratégica">

                    </div>

                    <div class="solution-card__body">

                    <span
                            class="solution-card__number text-sm"
                            data-lang="solutions.card4.number">
                    </span>

                        <h3
                                class="solution-card__title title-md"
                                data-lang="solutions.card4.title">
                        </h3>

                        <p
                                class="solution-card__text text"
                                data-lang="solutions.card4.description">
                        </p>



                    </div>
                    </a>
                </article>

            </div>

        </div>

    </section>


    <!--==========================================================*
*ABOUT*
*==========================================================-->

    <section class="about" id="about">

        <div class="container">

            <div class="about__hero">

                <!--==================================================*
                *CONTENT*
                *==================================================-->

                <div class="about__content">

                <span
                        class="about__eyebrow text-sm"
                        data-lang="about.eyebrow">
                </span>

                    <h2 class="about__title title-lg">

                        <span data-lang="about.titleLine1"></span>

                        <span data-lang="about.titleLine2"></span>

                        <span>
                        <span
                                class="about__highlight"
                                data-lang="about.highlight">
                        </span>

                        <span data-lang="about.titleLine3"></span>
                    </span>

                    </h2>

                    <p
                            class="about__description text"
                            data-lang="about.description">
                    </p>

                    <div class="about__line"></div>

                    <p
                            class="about__values"
                            data-lang="about.values">
                    </p>

                </div>


                <!--==================================================*
                *IMAGE*
                *==================================================-->

                <div class="about__image">

                    <img
                            src="assets/images/about-team.jpg"
                            alt="VM Agency">

                </div>

            </div>


            <!--==================================================*
            *BOTTOM*
            *==================================================-->

            <div class="about__bottom">

                <div class="about__statement">

                    <div class="about__statement-icon">
                        <i class="icon-sparkles"></i>
                    </div>

                    <p data-lang="about.statement"></p>

                </div>


                <div class="about__founders">

                    <div
                            class="about__founders-name"
                            data-lang="about.founders">
                    </div>

                    <span data-lang="about.foundersRole"></span>

                </div>

            </div>

        </div>

    </section>

    <section class="contact" id="contact">

        <div class="container">

            <div class="contact__wrapper">

                <!--======================================================
                LEFT
                =======================================================-->

                <div class="contact__info reveal-left">

                <span
                        class="contact__eyebrow text-sm"
                        data-lang="contact.eyebrow">
                </span>

                    <h2 class="contact__title title-lg">

                        <span data-lang="contact.title1"></span>

                        <span
                                class="contact__highlight"
                                data-lang="contact.highlight">
                    </span>

                    </h2>

                    <p
                            class="contact__description text"
                            data-lang="contact.description">
                    </p>

                    <div class="contact__features">

                        <div class="contact__feature">

                            <div class="contact__icon">

                                <i class="icon-user-round"></i>

                            </div>

                            <div>

                                <h3
                                        class="contact__feature-title"
                                        data-lang="contact.feature1.title">
                                </h3>

                                <p
                                        data-lang="contact.feature1.description">
                                </p>

                            </div>

                        </div>

                        <div class="contact__feature">

                            <div class="contact__icon">

                                <i class="icon-message-circle-more"></i>

                            </div>

                            <div>

                                <h3
                                        class="contact__feature-title"
                                        data-lang="contact.feature2.title">
                                </h3>

                                <p
                                        data-lang="contact.feature2.description">
                                </p>

                            </div>

                        </div>

                        <div class="contact__feature">

                            <div class="contact__icon">

                                <i class="icon-lock"></i>

                            </div>

                            <div>

                                <h3
                                        class="contact__feature-title"
                                        data-lang="contact.feature3.title">
                                </h3>

                                <p
                                        data-lang="contact.feature3.description">
                                </p>

                            </div>

                        </div>

                    </div>

                </div>

                <!--======================================================
                FORM
                =======================================================-->

                <div class="contact__card reveal-right">

                    <div class="contact__card-header">

                        <div class="contact__mail">

                            <i class="icon-mail"></i>

                        </div>

                        <div>

                            <h3
                                    class="contact__card-title"
                                    data-lang="contact.form.title">
                            </h3>

                            <p
                                    class="contact__card-description"
                                    data-lang="contact.form.description">
                            </p>

                        </div>

                    </div>

                    <form class="contact__form">

                        <div class="contact__field">

                            <label
                                    data-lang="contact.form.name">
                            </label>

                            <input
                                    type="text"
                                    data-placeholder="contact.form.placeholderName">

                        </div>

                        <div class="contact__field">

                            <label
                                    data-lang="contact.form.email">
                            </label>

                            <input
                                    type="email"
                                    data-placeholder="contact.form.placeholderEmail">

                        </div>

                        <div class="contact__field">

                            <label
                                    data-lang="contact.form.company">
                            </label>

                            <input
                                    type="text"
                                    data-placeholder="contact.form.placeholderCompany">

                        </div>

                        <div class="contact__field">

                            <label
                                    data-lang="contact.form.message">
                            </label>

                            <textarea
                                    rows="6"
                                    data-placeholder="contact.form.placeholderMessage">
                        </textarea>

                        </div>

                        <button
                                type="submit"
                                class="button button--primary contact__submit">

                        <span
                                data-lang="contact.form.button">
                        </span>

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </section>
</main>

<!-- ========================================================= -->
<!-- FOOTER -->
<!-- ========================================================= -->
<footer class="footer">

    <div class="container">

        <div class="footer__wrapper">

            <div class="footer__brand">

                <a href="#hero" class="footer__logo">

                    <img
                            src="assets/logos/logo.png"
                            alt="VM Agency Logo">

                </a>

                <p
                        class="footer__description text-sm"
                        data-lang="footer.description">
                </p>

                <div class="footer__social">

                    <!-- INSTAGRAM -->
                    <a href="#" aria-label="Instagram">
                        <svg
                                viewBox="0 0 24 24"
                                aria-hidden="true">
                            <rect
                                    x="3"
                                    y="3"
                                    width="18"
                                    height="18"
                                    rx="5"
                                    ry="5">
                            </rect>

                            <circle
                                    cx="12"
                                    cy="12"
                                    r="4">
                            </circle>

                            <circle
                                    cx="17.5"
                                    cy="6.5"
                                    r="1">
                            </circle>
                        </svg>
                    </a>

                    <!-- LINKEDIN -->
                    <a href="#" aria-label="LinkedIn">
                        <svg
                                viewBox="0 0 24 24"
                                aria-hidden="true">
                            <path
                                    d="M6.5 8.5H3.5V20h3V8.5ZM5 3.5
                A1.75 1.75 0 1 0 5 7
                A1.75 1.75 0 0 0 5 3.5ZM10 8.5H7V20h3v-5.7
                c0-1.5.3-3 2.2-3
                1.9 0 1.9 1.8 1.9 3.1V20h3v-6.2
                c0-3-0.6-5.3-4-5.3
                -1.6 0-2.7.9-3.1 1.7V8.5Z">
                            </path>
                        </svg>
                    </a>

                    <!-- EMAIL -->
                    <a href="mailto:hola@vmagency.com" aria-label="Email">
                        <i class="icon-mail"></i>
                    </a>

                </div>

            </div>

            <div class="footer__column">

                <h3
                        class="footer__title text-sm"
                        data-lang="footer.navigation">
                </h3>

                <ul>

                    <li><a href="#hero" data-lang="footer.home"></a></li>

                    <li><a href="#method" data-lang="footer.method"></a></li>

                    <li><a href="#solutions" data-lang="footer.success"></a></li>

                    <li><a href="#about" data-lang="footer.about"></a></li>

                    <li>
                        <a href="#contact" data-lang="footer.contactUs"></a>
                    </li>

                </ul>

            </div>

            <div class="footer__column">

                <h3
                        class="footer__title text-sm"
                        data-lang="footer.legal">
                </h3>

                <ul>

                    <li><a href="#" data-lang="footer.legalNotice"></a></li>

                    <li><a href="#" data-lang="footer.privacy"></a></li>

                    <li><a href="#" data-lang="footer.cookies"></a></li>

                </ul>

            </div>

            <div class="footer__column">

                <h3
                        class="footer__title text-sm"
                        data-lang="footer.contact">
                </h3>

                <p
                        class="footer__contact-text"
                        data-lang="footer.contactDescription">
                </p>

                <ul class="footer__contact">

                    <li>

                        <i class="icon-mail"></i>

                        <span data-lang="footer.email"></span>

                    </li>

                    <li>

                        <i class="icon-phone"></i>

                        <span data-lang="footer.phone"></span>

                    </li>

                    <li>

                        <i class="icon-map-pin"></i>

                        <span data-lang="footer.location"></span>

                    </li>

                </ul>

            </div>

        </div>

        <div class="footer__bottom">

            <p
                    class="footer__copyright text-sm"
                    data-lang="footer.copyright">
            </p>

        </div>

    </div>

</footer>
<!-- ========================================================= -->
<!-- LANGUAGES -->
<!-- ========================================================= -->

<script src="lang/es.js"></script>

<script src="lang/en.js"></script>

<script src="lang/bg.js"></script>

<!-- ========================================================= -->
<!-- JAVASCRIPT -->
<!-- ========================================================= -->

<script src="js/language.js"></script>

<script src="js/navbar.js"></script>

<script src="js/animations.js"></script>

<script src="js/main.js"></script>

</body>

</html>
