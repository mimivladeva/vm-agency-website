<!DOCTYPE html>

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>Diseño Web | VM Agency</title>

    <meta

    <!-- =========================================================
         GOOGLE FONTS
    ========================================================== -->

    <link
            rel="preconnect"
            href="https://fonts.googleapis.com">

    <link
            rel="preconnect"
            href="https://fonts.gstatic.com"
            crossorigin>

    <link
            href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap"
            rel="stylesheet">


    <!-- =========================================================
         LUCIDE
    ========================================================== -->

    <link

            href="https://cdn.jsdelivr.net/npm/lucide-static@latest/font/lucide.css">


    <!-- =========================================================

    ========================================================== -->

    <link

            href="css/base/reset.css">

    <link
            rel="stylesheet"
            href="css/base/variables.css">

    <link

    <link

    <!-- =========================================================

    ========================================================== -->

    <link

    <link

            href="css/layout/footer.css">

    <link

<body>


<!-- =========================================================
     HEADER
========================================================= -->
<div id="navbar-container"></div>

<!-- =========================================================
     MAIN
========================================================= -->

<main>


    <!-- =====================================================
         HERO
    ====================================================== -->

    <section
            class="webservice-hero"
            id="web-design">


        <!-- =================================================
             BACKGROUND / VISUAL
        ================================================== -->

        <div class="webservice-hero__visual">

            <img
                    src="assets/images/webservicehero.webp"
                    alt="Diseño web personalizado"
                    data-lang-alt="web.imageAlt">

        </div>


        <!-- =================================================
             HERO CONTENT
        ================================================== -->

        <div class="webservice-hero__content">


            <!-- EYEBROW -->

            <div class="webservice-hero__eyebrow text-sm">

                <span data-lang="web.eyebrow">
            
                </span>

                <span class="webservice-hero__eyebrow-line"></span>

            </div>


            <!-- TITLE -->

            <h1 class="webservice-hero__title title-xl">

                <span data-lang="web.titleLine1">
                
                </span>

                <br>

                <span
                        class="webservice-hero__title-accent"
                        data-lang="web.titleLine2">

        

                </span>

            </h1>


            <!-- HANDWRITTEN SUBTITLE -->

            <p
                    class="webservice-hero__subtitle"
                    data-lang="web.subtitle">

            </p>


            <!-- DESCRIPTION -->

            <p
                    class="webservice-hero__description text"
                    data-lang="web.description">


            </p>


            <!-- CTA -->

            <a
                    href="index.html#contact"
                    class="webservice-hero__button">

                <span data-lang="web.cta">



                </span>

                <span
                        class="webservice-hero__button-arrow"
                        aria-hidden="true">

                    →

                </span>

            </a>


            <!-- =================================================
                 PHILOSOPHY
            ================================================== -->

            <div class="webservice-hero__philosophy">


                <div class="webservice-hero__philosophy-title">

                    <span
                            class="webservice-hero__philosophy-icon"
                            aria-hidden="true">

                        ♡

                    </span>

                    <span data-lang="web.philosophyTitle">

                        

                    </span>

                </div>


                <p
                        class="webservice-hero__philosophy-text"
                        data-lang="web.philosophyText">

                    

                </p>


            </div>


        </div>

        <a href="#web-features" class="webservice-hero__scroll" aria-label="Ir a las características">

            <svg
                    width="28"
                    height="28"
                    viewBox="0 0 24 24"
                    fill="none"
                    aria-hidden="true">

                <path
                        d="M12 5V18"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"/>

                <path
                        d="M7 13L12 18L17 13"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"/>

            </svg>

        </a>


    </section>



    <!-- ==========================================================
         WEB SERVICE — FEATURES
    ========================================================== -->

    <section
            class="web-features"
            id="web-features">

        <div class="web-features__container">


            <!-- ==================================================
                 HEADER
            ================================================== -->

            <div class="web-features__header">

                <span
                        class="web-features__eyebrow text-sm"
                        data-lang="webFeatures.eyebrow">

                    

                </span>


                <h2 class="web-features__title title-lg">

                    <span data-lang="webFeatures.titleLine1">

                        

                    </span>

                    <br>

                    <span data-lang="webFeatures.titleLine2">

                    

                    </span>

                    <span

                            data-lang="webFeatures.titleAccent">

                    

                    </span>

                </h2>

            </div>



            <!-- ==================================================
                 FEATURES FLOW
            ================================================== -->

            <div class="web-features__flow">


                <!-- ==================================================
                     01 — DISEÑO A MEDIDA
                ================================================== -->

                <div class="web-feature-step">

                    <article class="web-feature">

                        <span class="web-feature__number">
                            01
                        </span>


                        <div class="web-feature__icon">

                            <img
                                    src="assets/icons/web-design.svg"
                                    alt=""
                                    aria-hidden="true">

                        </div>



                        <h3
                                class="web-feature__title title-sm"
                                data-lang="webFeatures.custom.title">
                            
                        </h3>

                        <span
                                class="web-feature__underline"
                                aria-hidden="true">
                        </span>


                        <p
                                class="web-feature__text"
                                data-lang="webFeatures.custom.text">
                            
                        </p>
                    </article>


                    <!-- ARROW 01 → 02 -->

                    <img
                            class="web-feature__arrow"
                            src="assets/icons/web-arrow-01.svg"
                            alt=""
                            aria-hidden="true">

                </div>



                <!-- ==================================================
                     02 — SEO
                ================================================== -->

                <div class="web-feature-step">

                    <article class="web-feature">

                        <span class="web-feature__number">
                            02
                        </span>


                        <div class="web-feature__icon">

                            <img
                                    src="assets/icons/web-seo.svg"
                                    alt=""
                                    aria-hidden="true">

                        </div>


                        <h3
                                class="web-feature__title"
                                data-lang="webFeatures.seo.title">

                            
                        </h3>


                        <span
                                class="web-feature__underline"
                                aria-hidden="true">
                        </span>


                        <p
                                class="web-feature__text"
                                data-lang="webFeatures.seo.text">

                            

                        </p>

                    </article>


                    <!-- ARROW 02 → 03 -->

                    <img
                            class="web-feature__arrow"
                            src="assets/icons/web-arrow-02.svg"
                            alt=""
                            aria-hidden="true">

                </div>



                <!-- ==================================================
                     03 — RENDIMIENTO
                ================================================== -->

                <div class="web-feature-step">

                    <article class="web-feature">

                        <span class="web-feature__number">
                            03
                        </span>


                        <div class="web-feature__icon">

                            <img
                                    src="assets/icons/web-performance.svg"
                                    alt=""
                                    aria-hidden="true">

                        </div>


                        <h3
                                class="web-feature__title"
                                data-lang="webFeatures.performance.title">

                    

                        </h3>


                        <span
                                class="web-feature__underline"
                                aria-hidden="true">
                        </span>


                        <p
                                class="web-feature__text"
                                data-lang="webFeatures.performance.text">

                        

                        </p>

                    </article>


                    <!-- ARROW 03 → 04 -->

                    <img
                            class="web-feature__arrow"
                            src="assets/icons/web-arrow-03.svg"
                            alt=""
                            aria-hidden="true">

                </div>



                <!-- ==================================================
                     04 — SEGURIDAD
                ================================================== -->

                <div class="web-feature-step">

                    <article class="web-feature">

                        <span class="web-feature__number">
                            04
                        </span>


                        <div class="web-feature__icon">

                            <img
                                    src="assets/icons/web-security.svg"
                                    alt=""
                                    aria-hidden="true">

                        </div>


                        <h3
                                class="web-feature__title"
                                data-lang="webFeatures.security.title">

                            

                        </h3>


                        <span
                                class="web-feature__underline"
                                aria-hidden="true">
                        </span>


                        <p
                                class="web-feature__text"
                                data-lang="webFeatures.security.text">

                           

                        </p>

                    </article>


                    <!-- ARROW 04 → 05 -->

                    <img
                            class="web-feature__arrow"
                            src="assets/icons/web-arrow-04.svg"
                            alt=""
                            aria-hidden="true">

                </div>



                <!-- ==================================================
                     05 — FÁCIL DE GESTIONAR
                ================================================== -->

                <div class="web-feature-step">

                    <article class="web-feature">

                        <span class="web-feature__number">

                        <div class="web-feature__icon">

                            <img
                                    src="assets/icons/web-management.svg"
                                    alt=""
                                    aria-hidden="true">

                        </div>


                        <h3
                                class="web-feature__title"
                                data-lang="webFeatures.management.title">

                            

                        </h3>


                        <span
                                class="web-feature__underline"
                                aria-hidden="true">
                        </span>


                        <p
                                class="web-feature__text"
                                data-lang="webFeatures.management.text">

                    

                        </p>

                    </article>


                    <!-- ARROW 05 → 06 -->

                    <img
                            class="web-feature__arrow"
                            src="assets/icons/web-arrow-05.svg"
                            alt=""
                            aria-hidden="true">

                </div>

                     06 — ESCALABLE
                ================================================== -->

                <div class="web-feature-step">

                    <article class="web-feature">

                        <span class="web-feature__number">
                            06
                        </span>


                        <div class="web-feature__icon">

                            <img
                                    src="assets/icons/web-scalable.svg"
                                    alt=""
                                    aria-hidden="true">

                        </div>


                        <h3
                                class="web-feature__title"
                                data-lang="webFeatures.scalable.title">
                            
                        </h3>


                        <span
                                class="web-feature__underline"
                                aria-hidden="true">
                        </span>


                        <p
                                class="web-feature__text"
                                data-lang="webFeatures.scalable.text">

                            

                        </p>

            </div>

            ================================================== -->

            <div class="web-features__ceo">

                <div class="web-features__ceo-tape"></div>


                <div class="web-features__ceo-portrait">

                    <img
                            src="assets/images/ceo.webp"

                </div>


                <div class="web-features__ceo-content">

                    <span
                            class="web-features__ceo-title"
